name: Deploy OMS Sync to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'oms_daily_sync.py'
      - 'Dockerfile'
      - 'requirements.txt'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/174773483931/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@orlinappareldataset.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push via Cloud Build
        run: |
          gcloud builds submit \
            --tag gcr.io/orlinappareldataset/oms-daily-sync:latest \
            --project=orlinappareldataset

      - name: Update Cloud Run Job
        run: |
          gcloud run jobs update oms-backfill-job \
            --image=gcr.io/orlinappareldataset/oms-daily-sync:latest \
            --region=asia-south1 \
            --project=orlinappareldataset \
            --task-timeout=10800

      - name: Done
        run: echo "Deployed successfully!"
